[package]
name = "rift-app-indicator"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rift-app-indicator"
path = "src/bin/rift-app-indicator.rs"

[dependencies]
rift-client = { git = "https://github.com/acsandmann/rift", package = "rift-client" }
objc2 = { version = "0.6.2", default-features = false, features = ["exception"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSApplication",
    "NSAttributedString",
    "NSButton",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSFont",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSPanel",
    "NSResponder",
    "NSRunningApplication",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
    "NSWorkspace",
    "objc2-core-foundation",
    "objc2-core-graphics",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "CFAttributedString",
    "CFString",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "CGColor",
    "CGError",
    "objc2",
] }
objc2-core-text = { version = "0.3.2", default-features = false, features = [
    "CTLine",
    "objc2-core-graphics",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSAttributedString",
    "NSString",
    "NSThread",
    "NSValue",
] }
serde_json = "1.0.145"
